<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bpm-js</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #22c55e;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        width: min(900px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      .tag {
        display: inline-block;
        background: rgba(34, 197, 94, 0.15);
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }

      p {
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .card {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      code {
        background: rgba(148, 163, 184, 0.12);
        color: #f8fafc;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tag">bpm-js</div>
      <h1>JavaScript Açık Kaynak Ekosistemi</h1>
      <p>
        Bu sayfa, <strong>bpm-js</strong> topluluğu için basit bir tanıtım ve giriş arayüzüdür.
        Repo, JavaScript araçları ve açık kaynak paketler için bir merkez olarak düşünülebilir.
      </p>

      <div class="card">
        <p>
          Kod örneği: <code>npm install bpm-js</code>
        </p>
      </div>
    </div>
  </body>
</html>
